name: CodeQL

# Free GitHub Actions security analysis for public repositories.
# Surfaces results in the Security tab on github.com/OrygnsCode/BitSeal-SDK.
#
# Triggered on every push + pull request to master, plus a weekly
# scheduled run so newly-disclosed CVEs in the analyzer's database get
# replayed against the repo even if no commits land in the meantime.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 12:00 UTC every Monday. The minute (0) is staggered slightly off
    # the top of the hour to spread load across the GitHub fleet.
    - cron: "0 12 * * 1"

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # security-extended enables the broader security query suite.
          # security-and-quality adds maintainability checks. Both are
          # well within free-tier minutes for a repo of this size.
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
