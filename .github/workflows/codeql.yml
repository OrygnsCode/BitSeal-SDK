name: CodeQL

# Free GitHub Actions security analysis for public repositories.
# Surfaces results in the Security tab on github.com/OrygnsCode/BitSeal-SDK.
#
# Triggered on every push + pull request to master, plus a weekly
# scheduled run so newly-disclosed CVEs in the analyzer's database get
# replayed against the repo even if no commits land in the meantime.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 12:00 UTC every Monday. The minute (0) is staggered slightly off
    # the top of the hour to spread load across the GitHub fleet.
    - cron: "0 12 * * 1"
  # Manual trigger. Added 2026-08-31: this workflow was auto-disabled after
  # 60 days of repo inactivity and there was no way to run it by hand to
  # confirm it worked again. Note the 60-day clock keys on REPOSITORY
  # activity, not workflow state, so re-enabling alone does not reset it;
  # only a commit does.
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # F-2-MED-5: third-party actions pinned by full commit SHA, not floating
      # tag. Dependabot's `github-actions` ecosystem (configured in
      # .github/dependabot.yml) opens weekly PRs to bump these SHAs.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # codeql-action v4.36.0 (released 2026-05-22) is the current major;
      # the v3 floating tag was still on Node 20 as of 2026-06-02 and would
      # have broken on the 2026-06-16 Node 20 deprecation. v4.x is Node 24.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: python
          # security-extended enables the broader security query suite.
          # security-and-quality adds maintainability checks. Both are
          # well within free-tier minutes for a repo of this size.
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: "/language:python"
